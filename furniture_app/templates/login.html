{% extends 'base.html' %}

{% block title %}Sign In — My Furniture Store{% endblock %}

{% block content %}
<div class="form-container">
    <h2><i class="fa-solid fa-right-to-bracket"></i> Sign In</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> Log In</button>
    </form>
    <p class="login-link">Don't have an account? <a href="{% url 'furniture_app:signup' %}">Sign Up</a></p>
</div>
{% endblock %}
