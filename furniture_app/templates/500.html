{% extends 'base.html' %}

{% block title %}500 Server Error — Atelier Living{% endblock %}

{% block content %}
<div class="error-card">
    <div class="error-card__icon" style="color: #d97706; background: rgba(217, 119, 6, 0.14);">
        <i class="fa-solid fa-screwdriver-wrench"></i>
    </div>
    <p class="error-card__code">500</p>
    <h2 class="error-card__title">Something Went Wrong</h2>
    <p class="error-card__desc">An unexpected error occurred on our end. Please try again in a moment.</p>
    <div class="error-card__actions">
        <a href="{% url 'furniture_app:index' %}" class="back-to-products-btn">
            <i class="fa-solid fa-rotate-left"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
