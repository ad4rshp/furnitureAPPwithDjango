{% extends 'base.html' %}

{% block title %}Create Account — Atelier Living{% endblock %}

{% block content %}
<div class="form-container">
    <h2><i class="fa-solid fa-user-plus"></i> Create Account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"><i class="fa-solid fa-check"></i> Register</button>
    </form>
    <p class="login-link">Already have an account? <a href="{% url 'furniture_app:login' %}">Log In</a></p>
</div>
{% endblock %}
